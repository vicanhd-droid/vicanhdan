<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung Thu 3D</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css.css">

    <style>
        /* CSS Thanh nút công cụ - Đẩy sang góc trên bên phải, lên lớp trên cùng */
        .top-bar {
            position: fixed !important;
            top: 15px !important;
            right: 15px !important;
            left: auto !important;
            transform: none !important;
            z-index: 9999 !important; /* Đảm bảo nằm đè lên trên chữ */
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        /* CSS Giao diện nhập tên & Lời chúc Trung Thu */
        .greeting-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .greeting-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 0 10px #e056fd, 0 0 20px #be2edd, 0 0 30px #be2edd;
        }

        .input-control-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
        }

        #customNameInput {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid rgba(224, 86, 253, 0.6);
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(5px);
            width: 55%;
            text-align: center;
        }

        #customNameInput::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .toggle-btn, .sky-upload-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #e056fd, #686de0);
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(224, 86, 253, 0.6);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .sky-upload-btn {
            background: linear-gradient(135deg, #00b894, #0984e3);
            box-shadow: 0 0 12px rgba(9, 132, 227, 0.6);
        }

        .toggle-btn:active, .sky-upload-btn:active {
            transform: scale(0.95);
        }

        .name-display {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            margin-top: 2px;
            text-shadow: 0 0 8px #e056fd, 0 0 15px #be2edd;
            transition: all 0.3s ease;
        }

        .name-display.hidden {
            display: none;
        }

        /* Dòng chữ "Tạo bởi: Vi Canh Dần" */
        .creator-signature {
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            animation: gradient-shift 3s infinite linear;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .footer-caption {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-family: 'Quicksand', sans-serif;
            text-shadow: 0 0 8px rgba(224, 86, 253, 0.8);
            pointer-events: none;
            white-space: nowrap;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <!-- Thanh nút nhạc và reset góc nhìn nằm cố định ở góc trên bên phải -->
    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <!-- Khung tiêu đề & Nhập tên chúc Trung Thu -->
    <div class="greeting-box" id="greetingBox">
        <h1 class="greeting-title">🌕 Chúc Mừng Trung Thu</h1>
        
        <div class="input-control-group">
            <input type="text" id="customNameInput" placeholder="Nhập tên của bạn..." value="Vi Canh Dần">
            <button class="toggle-btn" id="toggleNameBtn" onclick="toggleNameVisibility()">✨ Hiện tên</button>
            
            <!-- Nút chọn ảnh bầu trời -->
            <label for="skyImageInput" class="sky-upload-btn">
                🌌 Đổi bầu trời
            </label>
            <input type="file" id="skyImageInput" accept="image/*" style="display: none;" onchange="changeSkyBackground(event)">
        </div>

        <div class="name-display hidden" id="nameDisplay">
            🐰 <span id="displayNameText">Vi Canh Dần</span>
        </div>

        <!-- Dòng chữ "Tạo bởi" -->
        <div class="creator-signature">
            ✨ Tạo bởi: Vi Canh Dần ✨
        </div>
    </div>

    <div class="click-hint">Chạm vào lồng đèn nhé</div>

    <!-- Chú thích chân trang -->
    <div class="footer-caption" id="footerCaption">
        🐰 <span id="footerNameText">Vi Canh Dần</span> • Kéo màn hình để xoay cảnh 360° ✨
    </div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">Thông Điệp Gửi Cậu</h3>
            
            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>

            <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
            <div class="tag">✦ Trung Thu An Lành ✦</div>
        </div>
    </div>

    <audio id="bgm" loop src="./assets/1.mp3"></audio>
    
    <!-- Three.js & OrbitControls -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>

    <!-- Script xử lý logic -->
    <script>
        // Bật / Ẩn tên
        function toggleNameVisibility() {
            const input = document.getElementById('customNameInput');
            const nameDisplay = document.getElementById('nameDisplay');
            const displayNameText = document.getElementById('displayNameText');
            const footerNameText = document.getElementById('footerNameText');
            const btn = document.getElementById('toggleNameBtn');

            const enteredName = input.value.trim() !== '' ? input.value.trim() : 'Vi Canh Dần';

            if (nameDisplay.classList.contains('hidden')) {
                displayNameText.textContent = enteredName;
                footerNameText.textContent = enteredName;
                nameDisplay.classList.remove('hidden');
                btn.textContent = '🙈 Ẩn tên';
                btn.style.background = 'linear-gradient(135deg, #ff7675, #d63031)';
            } else {
                nameDisplay.classList.add('hidden');
                btn.textContent = '✨ Hiện tên';
                btn.style.background = 'linear-gradient(135deg, #e056fd, #686de0)';
            }
        }

        // Đổi ảnh nền bầu trời
        function changeSkyBackground(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                
                if (typeof scene !== 'undefined') {
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(imageUrl, function(texture) {
                        scene.background = texture;
                    });
                } else {
                    document.body.style.backgroundImage = `url('${imageUrl}')`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
